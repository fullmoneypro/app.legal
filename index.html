        /* Pengaturan agar header rapi dan bisa menyesuaikan layar */
        .nav-container {
            display: flex;

            justify-content: space-between;
            align-items: center;

            display: flex;
            align-items: center;

        }

            border: 1px solid #ccc;
            border-radius: 50px;
            outline: none;
        }

        /* KUNCI RESPONSIVE: Saat layar seukuran HP (di bawah 650px) */
        @media (max-width: 650px) {
            .nav-container {
                justify-content: center; /* Tengahkan semua di HP */
            }
            .nav-left {
                justify-content: center;
            }
            .search-box-header {
                margin-left: 0;
                max-width: 100%; /* Kotak pencarian penuhi lebar layar di baris kedua */
